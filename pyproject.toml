[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talanton"
version = "0.1.0"
description = "The universal meter for what your AI calls actually cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ameya", email = "" }
]

[project.urls]
Homepage = "https://github.com/Ameya79/Talanton"
Repository = "https://github.com/Ameya79/Talanton"
Issues = "https://github.com/Ameya79/Talanton/issues"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
openai = ["tiktoken>=0.7.0"]
anthropic = ["anthropic>=0.25.0"]
huggingface = ["transformers>=4.40.0", "tokenizers>=0.19.0"]
cli = ["rich>=13.0.0"]
all = [
    "tiktoken>=0.7.0",
    "anthropic>=0.25.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "rich>=13.0.0"
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
talanton = "talanton.cli:cli"

[tool.setuptools.package-data]
talanton = ["*.json", "pricing/*.json"]
