[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talanton-py"
version = "0.2.2"
description = "The universal meter for what your AI calls actually cost — live cost tracking, budget guardrails, and multi-provider token counting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ameya Kulkarni", email = "acclaptop47@gmail.com" }
]
keywords = [
    "llm",
    "tokens",
    "cost",
    "openai",
    "anthropic",
    "ai",
    "observability",
    "budget",
    "tracking",
    "metering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/Ameya79/Talanton"
Repository = "https://github.com/Ameya79/Talanton"
Issues = "https://github.com/Ameya79/Talanton/issues"
Documentation = "https://github.com/Ameya79/Talanton#readme"

[project.optional-dependencies]
openai = ["tiktoken>=0.7.0"]
anthropic = ["anthropic>=0.25.0"]
huggingface = ["transformers>=4.40.0", "tokenizers>=0.19.0"]
cli = ["rich>=13.0.0"]
tracker = []
integrations-openai = ["openai>=1.0.0", "tiktoken>=0.7.0"]
integrations-anthropic = ["anthropic>=0.25.0"]
integrations-langchain = ["langchain-core>=0.1.0"]
integrations-litellm = ["litellm>=1.0.0"]
all = [
    "tiktoken>=0.7.0",
    "anthropic>=0.25.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
talanton = "talanton.cli:cli"

[tool.setuptools.package-data]
talanton = ["*.json", "pricing/*.json"]

[tool.setuptools.packages.find]
include = ["talanton*"]
